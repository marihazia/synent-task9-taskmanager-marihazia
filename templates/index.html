<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/static/style.css">
    <title>Task Manager</title>
</head>
<body>
    <div class="container">
    <h1>My Task Manager</h1>

    <p class="subtitle">Add, view, and manage your tasks.</p><hr><br>
    <form action="/add" method="POST">
        <input type="text" name="task" placeholder="Enter a new task" required>
        <button type="submit">Add Task</button></form><br><hr>
    <h2 class="section-title">My Tasks Lists</h2>
    <ol>
        {% for task in tasks %}
        <li>
            {{ task.content }}
            <a href="/delete/{{ task.id }}" class="link-danger">Delete</a>
        </li>
        {% endfor %}
    </ol><br><hr>
    <form action="/logout" method="GET" style="text-align: center;">
        <button type="submit" class="btn-logout">Logout</button>
    </form>
    </div>
</body>
</html>
